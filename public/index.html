<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>内盘快速交易 · BNB / RH</title>
<style>
  :root { --bg:#0a0a0c; --card:#141419; --line:#26262e; --tx:#e8e8ea; --muted:#8a8a94; --g:#22c55e; --r:#ef4444; --y:#eab308; --accent:#3b82f6; }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--tx); font:14px/1.5 -apple-system,Segoe UI,Microsoft YaHei,sans-serif; }
  .wrap { max-width:960px; margin:0 auto; padding:16px; }
  h1 { font-size:18px; margin:0 0 12px; }
  .card { background:var(--card); border:1px solid var(--line); border-radius:12px; padding:14px; margin-bottom:14px; }
  .grid { display:flex; gap:10px; flex-wrap:wrap; }
  .kv { flex:1; min-width:130px; background:#0e0e12; border:1px solid var(--line); border-radius:8px; padding:10px; }
  .kv .k { color:var(--muted); font-size:12px; }
  .kv .v { font-size:18px; font-weight:600; font-variant-numeric:tabular-nums; }
  input, button, select { font:inherit; border-radius:8px; border:1px solid var(--line); background:#0e0e12; color:var(--tx); padding:8px 10px; }
  input { width:100%; }
  button { cursor:pointer; background:#1a1a22; }
  button:hover { background:#22222c; }
  .btn-buy { background:var(--g); color:#000; border:none; font-weight:700; }
  .btn-sell { background:var(--r); color:#fff; border:none; font-weight:600; }
  .btn-sm { padding:4px 10px; font-size:12px; margin-left:4px; }
  table { width:100%; border-collapse:collapse; }
  th, td { text-align:left; padding:8px 6px; border-bottom:1px solid var(--line); font-variant-numeric:tabular-nums; }
  th { color:var(--muted); font-weight:500; font-size:12px; }
  .pos { color:var(--g); } .neg { color:var(--r); }
  .muted { color:var(--muted); font-size:12px; }
  .row { display:flex; gap:10px; align-items:center; margin-bottom:10px; }
  .row .grow { flex:1; }
  .quote { margin-top:8px; color:var(--y); font-size:13px; }
  .err { color:var(--r); margin-top:8px; font-size:13px; }
  .preset { background:#1a1a22; border:1px solid var(--line); }
  .preset:hover { background:#22222c; }
  .preset.active { border-color:var(--accent); color:var(--accent); }
  .tabs { display:flex; gap:8px; margin-bottom:12px; }
  .tab { flex:1; text-align:center; padding:10px; background:#141419; border:1px solid var(--line); border-radius:10px; cursor:pointer; font-weight:600; color:var(--muted); }
  .tab.active { background:#1a1a22; color:var(--tx); border-color:var(--accent); }
</style>
</head>
<body>
<div class="wrap">
  <h1>内盘快速交易</h1>

  <div class="tabs">
    <button class="tab" id="tabBsc" onclick="setChain('bsc')">BNB 链（gang.fun）</button>
    <button class="tab opt" data-opt="rh" id="tabRh" onclick="setChain('rh')">Robinhood（mobster）</button>
    <button class="tab opt" data-opt="sol" id="tabSol" onclick="setChain('sol')">Solana</button>
    <button class="tab opt" data-opt="discover" id="tabDiscover" onclick="setChain('discover')">🔥 发现</button>
    <button class="tab opt" data-opt="accounts" id="tabAccts" onclick="setChain('accounts')">👥 A/B 账户</button>
    <button class="tab" id="settingsBtn" onclick="toggleSettings()" title="选择显示哪些标签">⚙</button>
  </div>
  <div id="tabSettings" style="display:none;background:#141419;border:1px solid #26262e;border-radius:8px;padding:10px;margin-bottom:10px">
    <div style="font-size:12px;color:#8a8a94;margin-bottom:6px">选择显示哪些标签（BNB 固定）</div>
    <label style="display:block;margin:4px 0;cursor:pointer"><input type="checkbox" data-opt-toggle="rh"> Robinhood（mobster）</label>
    <label style="display:block;margin:4px 0;cursor:pointer"><input type="checkbox" data-opt-toggle="sol"> Solana</label>
    <label style="display:block;margin:4px 0;cursor:pointer"><input type="checkbox" data-opt-toggle="discover"> 🔥 发现（监控 agent 在打）</label>
    <label style="display:block;margin:4px 0;cursor:pointer"><input type="checkbox" data-opt-toggle="accounts"> 👥 A/B 账户</label>
  </div>

  <div id="tradeCards">
  <div class="card">
    <div class="grid" id="balGrid"></div>
    <div class="row" style="margin-top:10px" id="balBtns"></div>
  </div>

  <div class="card">
    <div class="row">
      <div class="grow"><input id="token" placeholder="代币地址 0x…" value="0xe0165a1b3d8f9e276b0746adcb9c7094cbd05785"></div>
      <button id="pastebtn">读取剪贴板</button>
      <button id="qbtn">查询</button>
    </div>
    <div id="tinfo" class="muted">输入地址点「查询」查看盘面</div>
    <div class="row" style="margin-top:10px" id="presets"></div>
    <div class="row" style="margin-top:8px">
      <div class="grow"><input id="amount" type="number" step="0.01" min="0.001" value="0.1" placeholder="数量"></div>
      <button class="btn-buy" id="buybtn" style="min-width:120px">买入</button>
      <button id="xferbtn" style="min-width:140px">转出当前代币</button>
    </div>
    <div id="buyquote" class="quote"></div>
    <div class="row" style="margin-top:8px">
      <span class="muted">滑点</span>
      <input id="slip" type="number" step="0.5" min="0.1" max="50" value="3" style="width:70px">
      <span class="muted">%</span>
      <span class="muted" style="margin-left:14px">刷新</span>
      <select id="interval" style="background:#0e0e12;color:var(--tx);border:1px solid var(--line);border-radius:8px;padding:6px">
        <option value="1000">1 秒</option>
        <option value="2000">2 秒</option>
        <option value="5000">5 秒</option>
      </select>
    </div>
    <div id="err" class="err"></div>
  </div>

  <div class="card">
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:10px">
      <h2 style="font-size:15px;margin:0">持仓 <span class="muted">(每 1 秒刷新 · <span id="quoteUnit">BNB</span> ≈ $<span id="quoteUsd">…</span>)</span></h2>
      <button id="refreshbtn" class="btn-sm">手动刷新</button>
    </div>
    <table id="postable">
      <thead id="poshead"></thead>
      <tbody id="posbody"><tr><td colspan="8" class="muted">加载中…</td></tr></tbody>
    </table>
  </div>
  </div>

  <div class="card" id="discoverView" style="display:none">
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;flex-wrap:wrap;gap:8px">
      <h2 style="font-size:15px;margin:0">BSC Agent 在打什么 <span class="muted" id="discoverSub">(24h 净流入 · 已过滤 meme)</span></h2>
      <div style="display:flex;gap:6px;align-items:center">
        <button class="btn-sm period" data-p="24h">24h</button>
        <button class="btn-sm period" data-p="1h">1h</button>
        <button class="btn-sm period" data-p="5m">5m</button>
        <button id="discoverRefresh" class="btn-sm">刷新</button>
      </div>
    </div>
    <div id="discoverBody" class="muted">加载中…</div>
  </div>

  <div class="card" id="accountsView" style="display:none">
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:10px">
      <h2 style="font-size:15px;margin:0">账号 A / B 持仓 <span class="muted">(转出到 <span id="accRecipient" class="mono">0xF55F…</span>)</span></h2>
      <button id="accountsRefresh" class="btn-sm">刷新</button>
    </div>
    <div id="accountsBody" class="muted">加载中…</div>
  </div>
</div>

<script>
const $ = (id) => document.getElementById(id);
let curChain = 'bsc';
let curToken = '';
let lastFullBnb = null;
let stateMem = {};

// 任意选择显示哪些标签（BNB 固定），记住到 localStorage
const OPT_TABS = ['rh', 'sol', 'discover', 'accounts'];
function getTabPrefs() {
  try { return JSON.parse(localStorage.getItem('gang-tabs') || 'null') || {}; } catch { return {}; }
}
function applyTabPrefs() {
  const prefs = getTabPrefs();
  OPT_TABS.forEach((k) => {
    const show = prefs[k] !== false; // 默认显示
    const btn = document.querySelector(`.tab.opt[data-opt="${k}"]`);
    if (btn) btn.style.display = show ? '' : 'none';
    const cb = document.querySelector(`input[data-opt-toggle="${k}"]`);
    if (cb) cb.checked = show;
  });
}
function toggleSettings() {
  const el = $('tabSettings');
  el.style.display = el.style.display === 'none' ? '' : 'none';
}
document.querySelectorAll('input[data-opt-toggle]').forEach((cb) => {
  cb.addEventListener('change', () => {
    const prefs = getTabPrefs();
    prefs[cb.dataset.optToggle] = cb.checked;
    localStorage.setItem('gang-tabs', JSON.stringify(prefs));
    applyTabPrefs();
    const key = cb.dataset.optToggle;
    if (!cb.checked && curChain === key) setChain('bsc');
  });
});
applyTabPrefs();

async function j(url, opt) { const r = await fetch(url, opt); return r.json(); }

function setChain(c) {
  curChain = c;
  const isDiscover = c === 'discover';
  const isAccounts = c === 'accounts';
  $('tabBsc').classList.toggle('active', c === 'bsc');
  $('tabRh').classList.toggle('active', c === 'rh');
  $('tabSol').classList.toggle('active', c === 'sol');
  $('tabDiscover').classList.toggle('active', isDiscover);
  $('tabAccts').classList.toggle('active', isAccounts);
  $('tradeCards').style.display = (isDiscover || isAccounts) ? 'none' : '';
  $('discoverView').style.display = isDiscover ? '' : 'none';
  $('accountsView').style.display = isAccounts ? '' : 'none';
  if (isDiscover) {
    loadDiscover();
    if (!discoverTimer) discoverTimer = setInterval(() => loadDiscover(), 30000);
    return;
  }
  if (isAccounts) {
    loadAccounts();
    if (discoverTimer) { clearInterval(discoverTimer); discoverTimer = null; }
    return;
  }
  if (discoverTimer) { clearInterval(discoverTimer); discoverTimer = null; }
  $('xferbtn').style.display = c === 'bsc' ? '' : 'none';
  $('token').value = c === 'bsc' ? '0x608f17dd1689847cb0ec8d9d009b0f7c91c7451b' : (c === 'rh' ? '0xe0165a1b3d8f9e276b0746adcb9c7094cbd05785' : '');
  $('token').placeholder = c === 'sol' ? 'Solana mint 地址（Base58）' : '代币地址 0x…';
  $('amount').value = c === 'bsc' ? '0.1' : '0.05';
  $('amount').placeholder = c === 'bsc' ? 'BNB 数量' : (c === 'rh' ? 'ETH 数量' : 'SOL 数量');
  renderPresets();
  if (stateMem[c]) renderState(stateMem[c]);  // 立即用上次缓存渲染，再拉最新
  refresh();
  if (c !== 'sol') query();
}

let discoverPeriod = '24h';
let discoverSeen = new Set();
let discoverTimer = null;

async function loadDiscover(period) {
  if (period) discoverPeriod = period;
  document.querySelectorAll('.period').forEach((x) => x.classList.toggle('active', x.dataset.p === discoverPeriod));
  const b = $('discoverBody');
  b.innerHTML = '加载中…';
  try {
    const r = await j('/api/discover?period=' + discoverPeriod);
    if (!r.ok) { b.innerHTML = `<span class="neg">${r.error}</span>`; return; }
    $('discoverSub').textContent = `(${discoverPeriod} 净流入 · 已过滤 meme · ${r.agentCount}/${r.total} 个 agent)`;
    if (!r.list || !r.list.length) { b.innerHTML = '<div class="muted">当前无 agent 项目被聪明钱净买入</div>'; return; }
    const cas = r.list.map((t) => t.ca);
    const isNew = (ca) => !discoverSeen.has(ca);
    discoverSeen = new Set(cas);
    b.innerHTML = r.list.map((t) => {
      const cls = t.inflow >= 0 ? 'pos' : 'neg';
      const newTag = isNew(t.ca) ? '<span style="color:var(--y);font-size:11px;margin-left:6px">NEW</span>' : '';
      const links = t.links && t.links.length
        ? t.links.map((l) => `<a href="${l.url}" target="_blank" rel="noreferrer" style="color:var(--accent);margin-right:8px">${l.label === 'x' ? '𝕏' : l.label}</a>`).join('')
        : '<span class="muted">—</span>';
      const risk = t.risk == null || t.risk === -1 ? '' : (t.risk === 1 ? '·低风险' : t.risk === 2 ? '·中风险' : '·<span class="neg">高风险</span>');
      const mc = t.marketCap >= 1e6 ? (t.marketCap / 1e6).toFixed(2) + 'M' : (t.marketCap >= 1e3 ? (t.marketCap / 1e3).toFixed(1) + 'K' : t.marketCap.toFixed(0));
      return `<div onclick="openToken('${t.ca}')" style="display:flex;align-items:center;gap:12px;padding:11px 0;border-bottom:1px solid var(--line);cursor:pointer">
        ${t.icon ? `<img src="${t.icon}" style="width:34px;height:34px;border-radius:50%;object-fit:cover;flex:0 0 auto">` : `<div style="width:34px;height:34px;border-radius:50%;background:#1a1a22;flex:0 0 auto"></div>`}
        <div style="flex:1;min-width:0">
          <div style="font-weight:600">${t.name}${newTag}</div>
          <div class="muted">${t.ca ? t.ca.slice(0,6) + '…' + t.ca.slice(-4) : ''} ${risk}${t.platform ? ' · ' + t.platform : ''}</div>
          <div style="margin-top:2px">${links}</div>
        </div>
        <div style="text-align:right;flex:0 0 auto">
          <div class="${cls}" style="font-weight:600">${t.inflow >= 0 ? '+' : ''}${t.inflow >= 1000 ? (t.inflow/1000).toFixed(1)+'K' : t.inflow.toFixed(0)} $</div>
          <div class="muted">净流入</div>
        </div>
        <div style="text-align:right;flex:0 0 auto">
          <div class="${t.priceChange >= 0 ? 'pos' : 'neg'}" style="font-weight:600">${t.priceChange >= 0 ? '+' : ''}${t.priceChange.toFixed(1)}%</div>
          <div class="muted">涨幅</div>
        </div>
        <div style="text-align:right;flex:0 0 auto">
          <div>$${mc}</div>
          <div class="muted">市值</div>
        </div>
      </div>`;
    }).join('');
  } catch (e) { b.innerHTML = `<span class="neg">加载失败: ${e.message}</span>`; }
}

function openToken(ca) {
  if (!ca || ca === '0x0000000000000000000000000000000000000000') return;
  $('token').value = ca;
  setChain('bsc');
  query();
}

async function loadAccounts() {
  const b = $('accountsBody');
  b.innerHTML = '加载中…';
  try {
    const r = await j('/api/accounts');
    if (!r.ok) { b.innerHTML = `<span class="neg">${r.error}</span>`; return; }
    if (r.recipient) $('accRecipient').textContent = r.recipient.slice(0, 6) + '…' + r.recipient.slice(-4);
    b.innerHTML = [r.A, r.B].map((acct) => {
      const rows = acct.tokens.map((t) => `
        <tr>
          <td>${t.symbol}</td>
          <td>${t.balance.toLocaleString(undefined,{maximumFractionDigits:4})}</td>
          <td style="text-align:right"><button class="btn-sm" onclick="transferFromAccount('${acct.name}','${t.token}','${t.symbol}')">转出</button></td>
        </tr>`).join('');
      return `<div class="card" style="margin-bottom:12px">
        <h3 style="font-size:14px;margin:0 0 8px">账号 ${acct.name} <span class="muted">${acct.addr.slice(0,6)}…${acct.addr.slice(-4)}</span></h3>
        <div class="kv" style="margin-bottom:8px"><div class="k">BNB</div><div class="v">${acct.bnb.toFixed(6)}</div></div>
        <table style="width:100%"><thead><tr><th>代币</th><th>余额</th><th style="text-align:right">操作</th></tr></thead><tbody>${rows}</tbody></table>
      </div>`;
    }).join('');
  } catch (e) { b.innerHTML = `<span class="neg">加载失败: ${e.message}</span>`; }
}

async function transferFromAccount(account, token, symbol) {
  if (!confirm(`确认把账号 ${account} 的【全部 ${symbol}】转出到 ${'0xF55FC5FC56a09716F4Bf77Adb890630cFB6b0de7'}？`)) return;
  $('err').textContent = '转出中…';
  try {
    const r = await j('/api/transfer-from', { method:'POST', headers:{'content-type':'application/json'}, body:JSON.stringify({ account, token }) });
    if (!r.ok) { $('err').textContent = r.error; return; }
    $('err').textContent = '';
    alert(`转出已提交（${r.status}）· ${r.amount.toLocaleString(undefined,{maximumFractionDigits:4})} ${symbol} → ${r.to}`);
    loadAccounts();
  } catch (e) { $('err').textContent = '转出失败: ' + e.message; }
}

function renderPresets() {
  const p = $('presets');
  if (curChain === 'bsc') {
    p.innerHTML = `
      <button class="preset" data-amt="0.05">0.05 BNB</button>
      <button class="preset" data-amt="0.1">0.1 BNB</button>
      <button class="preset" id="fillbtn">打满 1%</button>`;
    p.querySelectorAll('.preset[data-amt]').forEach((b) => {
      b.onclick = () => { $('amount').value = b.dataset.amt; buy(); };
    });
    $('fillbtn').onclick = async () => {
      if (!lastFullBnb) await query();
      if (!lastFullBnb) { $('buyquote').textContent = '先查询一个内盘代币，才能算打满 1%'; return; }
      $('amount').value = lastFullBnb;
      buy();
    };
  } else {
    const unit = curChain === 'rh' ? 'ETH' : 'SOL';
    p.innerHTML = `
      <button class="preset" data-amt="0.05">0.05 ${unit}</button>
      <button class="preset" data-amt="0.1">0.1 ${unit}</button>`;
    p.querySelectorAll('.preset[data-amt]').forEach((b) => {
      b.onclick = () => { $('amount').value = b.dataset.amt; buy(); };
    });
  }
}

async function refresh() {
  try {
    const s = await j('/api/state?chain=' + curChain);
    stateMem[s.chain] = s;
    if (s.chain === curChain) renderState(s);
  } catch (e) { $('err').textContent = '刷新失败: ' + e.message; }
}

function renderState(s) {
    $('quoteUnit').textContent = s.chain === 'rh' ? 'ETH' : (s.chain === 'sol' ? 'SOL' : 'BNB');
    if (s.chain === 'rh') {
      $('quoteUsd').textContent = (s.ethUsd || 0).toFixed(2);
      $('balGrid').innerHTML = `
        <div class="kv"><div class="k">钱包</div><div class="v" style="font-size:13px">${s.addr.slice(0,6)}…${s.addr.slice(-4)}</div></div>
        <div class="kv"><div class="k">ETH</div><div class="v">${s.eth.toFixed(4)}</div></div>
        <div class="kv"><div class="k">ETH 价值</div><div class="v">$${(s.eth * (s.ethUsd || 0)).toFixed(1)}</div></div>`;
      $('balBtns').innerHTML = '';
    } else if (s.chain === 'sol') {
      $('quoteUsd').textContent = (s.solUsd || 0).toFixed(2);
      $('balGrid').innerHTML = `
        <div class="kv"><div class="k">钱包</div><div class="v" style="font-size:13px">${s.addr.slice(0,6)}…${s.addr.slice(-4)}</div></div>
        <div class="kv"><div class="k">SOL</div><div class="v">${s.sol.toFixed(4)}</div></div>
        <div class="kv"><div class="k">SOL 价值</div><div class="v">$${(s.sol * (s.solUsd || 0)).toFixed(1)}</div></div>`;
      $('balBtns').innerHTML = '';
    } else {
      $('quoteUsd').textContent = (s.bnbUsd || 0).toFixed(2);
      $('balGrid').innerHTML = `
        <div class="kv"><div class="k">钱包</div><div class="v" style="font-size:13px">${s.addr.slice(0,6)}…${s.addr.slice(-4)}</div></div>
        <div class="kv"><div class="k">BNB</div><div class="v">${s.bnb.toFixed(4)}</div></div>
        <div class="kv"><div class="k">WBNB</div><div class="v">${s.wbnb.toFixed(4)}</div></div>
        <div class="kv"><div class="k">USDT</div><div class="v">${s.usdt.toFixed(2)}</div></div>`;
      $('balBtns').innerHTML = `
        <button id="unwrapbtn">WBNB → BNB（解包）</button>
        <button id="usdtbtn">USDT → BNB（兑换）</button>`;
      $('unwrapbtn').onclick = unwrap;
      $('usdtbtn').onclick = usdt2bnb;
    }
    // 表头
    $('poshead').innerHTML = `<tr><th>代币</th><th>数量</th><th>成本(USDT)</th><th>市值(USDT)</th><th>盈亏(USDT)</th><th>收益率</th>${curChain === 'bsc' ? '<th>自动策略</th>' : ''}<th style="text-align:right">操作</th></tr>`;
    const tb = $('posbody');
    const list = s.positions.filter((p) => p.balance > 0);
    if (!list.length) { tb.innerHTML = `<tr><td colspan="${curChain === 'bsc' ? 8 : 7}" class="muted">暂无持仓</td></tr>`; return; }
    tb.innerHTML = list.map((p) => {
      const cls = p.pnlBnb >= 0 ? 'pos' : 'neg';
      const sign = p.pnlBnb >= 0 ? '+' : '';
      const autoOn = !!p.auto?.enabled;
      const autoTxt = p.auto?.lastAction ? `<div class="muted">${p.auto.lastAction}</div>` : '';
      const autoCol = curChain === 'bsc'
        ? `<td><label style="cursor:pointer"><input type="checkbox" ${autoOn ? 'checked' : ''} onchange="toggleAuto('${p.token}', this.checked)"> 涨100%卖50% / 跌50%清仓</label>${autoTxt}</td>`
        : '';
      const xfer = curChain === 'bsc' ? `<button class="btn-sm" onclick="transfer('${p.token}')">转出</button>` : '';
      return `<tr>
        <td>${p.symbol}<div class="muted">${p.token.slice(0,6)}…${p.token.slice(-4)}</div></td>
        <td>${p.balance.toLocaleString(undefined,{maximumFractionDigits:2})}</td>
        <td>${(p.costUsd ?? 0).toFixed(2)}</td>
        <td>${(p.valueUsd ?? 0).toFixed(2)}</td>
        <td class="${cls}">${sign}${(p.pnlUsd ?? 0).toFixed(2)}</td>
        <td class="${cls}">${sign}${p.pnlPct.toFixed(1)}%</td>
        ${autoCol}
        <td style="text-align:right">
          <button class="btn-sm btn-sell" onclick="sell('${p.token}',10)">10%</button>
          <button class="btn-sm btn-sell" onclick="sell('${p.token}',25)">25%</button>
          <button class="btn-sm btn-sell" onclick="sell('${p.token}',50)">50%</button>
          <button class="btn-sm btn-sell" onclick="sell('${p.token}',100)">100%</button>
          ${xfer}
        </td>
      </tr>`;
    }).join('');
}

async function query() {
  const token = $('token').value.trim();
  if (!token) return;
  curToken = token;
  $('err').textContent = '';
  try {
    const t = await j(`/api/token?chain=${curChain}&token=${encodeURIComponent(token)}&bnb=${$('amount').value || 0.1}`);
    if (!t.ok) { $('tinfo').innerHTML = `<span class="neg">${t.error}</span>`; $('buyquote').textContent = ''; return; }
    if (curChain === 'rh') {
      const unit = t.quote || 'ETH';
      $('tinfo').innerHTML = `<b>${t.symbol}</b>${t.name ? ' (' + t.name + ')' : ''} · ${t.graduated ? '<span class="pos">已毕业（外盘）</span>' : '内盘'}<br>价格 ${t.priceBnb.toFixed(9)} ${unit}（$${(t.priceUsd || 0).toFixed(6)}）· 进度 ${t.progressPct.toFixed(1)}% · 持币 ${t.holders ?? '—'}<br><span class="muted">已募 ${t.raisedBnb.toFixed(2)} / ${t.gradAmtBnb.toFixed(0)} ${unit} · 你持有 ${t.myBalance.toLocaleString(undefined,{maximumFractionDigits:2})}</span>`;
      $('buyquote').textContent = `花 ${$('amount').value} ${unit} 买入（走 mobster，数量以成交为准）`;
      return;
    }
    if (curChain === 'sol') {
      $('tinfo').innerHTML = `<b>${t.symbol}</b>${t.name ? ' (' + t.name + ')' : ''} · Solana<br>价格 $${(t.priceUsd || 0).toFixed(6)} · 流动性 $${(t.liquidityUsd || 0).toLocaleString(undefined,{maximumFractionDigits:0})} · 24h 量 $${(t.volume24hUsd || 0).toLocaleString(undefined,{maximumFractionDigits:0})}<br><span class="muted">DEX: ${t.dexId || '—'} · 池子 ${t.pair || '—'}</span>`;
      $('buyquote').textContent = `花 ${$('amount').value} SOL 买入（走 Jupiter 聚合，数量以成交为准）`;
      return;
    }
    lastFullBnb = t.fullBnb || null;
    if (t.graduated) {
      $('tinfo').innerHTML = `<b>${t.symbol}</b>${t.name ? ' (' + t.name + ')' : ''} · <span class="pos">已毕业（外盘）</span><br>价格 ${t.priceBnb.toFixed(8)} BNB · 交易对 ${t.pair || '—'} · 持币 ${t.holders ?? '—'}`;
      $('buyquote').textContent = `花 ${$('amount').value} BNB ≈ 外盘买入（数量以实际成交为准）`;
      return;
    }
    const qs = t.quoteSymbol || 'BNB';
    $('tinfo').innerHTML = `<b>${t.symbol}</b>${t.name ? ' (' + t.name + ')' : ''} · 内盘 · pad ${t.pad || '—'}<br>已募 ${t.raisedBnb.toFixed(2)} / ${t.gradAmtBnb.toFixed(0)} ${qs}（${t.progressPct.toFixed(1)}%）`;
    if (t.buyableByPad) {
      if (t.tokensOut == null) {
        $('buyquote').textContent = `该盘报价币是 ${qs}（不是 BNB）：当前只支持查询，买入需先把 BNB 换成 ${qs} 再授权`;
      } else {
        $('buyquote').textContent = `花 ${$('amount').value} BNB ≈ 买 ${t.tokensOut.toLocaleString(undefined,{maximumFractionDigits:2})} 枚（已持有 ${t.myBalance.toLocaleString(undefined,{maximumFractionDigits:2})}，还能买 ${t.room.toLocaleString(undefined,{maximumFractionDigits:2})}）`;
      }
    } else {
      $('buyquote').textContent = `内盘但不在已知 pad 上（${t.pad || '无'}），暂不能直接买`;
    }
  } catch (e) { $('err').textContent = '查询失败: ' + e.message; }
}

async function buy() {
  const token = $('token').value.trim();
  const amt = $('amount').value;
  if (!token || !(+amt > 0)) { $('err').textContent = '填好地址和数量'; return; }
  const t0 = Date.now();
  const secs = () => ((Date.now() - t0) / 1000).toFixed(1);
  $('err').textContent = '买入中… 已用 0.0s';
  const timer = setInterval(() => { $('err').textContent = `买入中… 已用 ${secs()}s`; }, 100);
  const body = curChain === 'rh'
    ? { token, amount: +amt, chain: 'rh' }
    : curChain === 'sol'
      ? { token, amount: +amt, slippage: +($('slip')?.value || 3), chain: 'sol' }
      : { token, bnb: +amt, slippage: +($('slip')?.value || 3), chain: 'bsc' };
  try {
    const r = await j('/api/buy', { method:'POST', headers:{'content-type':'application/json'}, body:JSON.stringify(body) });
    clearInterval(timer);
    const used = ((r.elapsedMs ?? (Date.now() - t0)) / 1000).toFixed(1);
    if (!r.ok) { $('err').textContent = `买入失败（耗时 ${used}s）: ${r.error}`; return; }
    $('err').textContent = '';
    if (curChain === 'sol') {
      $('buyquote').textContent = `买入已提交 · 花费 ${r.spentSol} SOL${r.orderId ? ' · 订单 ' + r.orderId : ''} · 耗时 ${used}s`;
    } else if (curChain === 'rh') {
      $('buyquote').textContent = `买入已提交（${r.status}）· 花费 ${r.spentEth} ETH ≈ ${(r.expectTokens || 0).toLocaleString(undefined,{maximumFractionDigits:2})} 枚 · 耗时 ${used}s${r.txHash ? ' · ' + r.txHash : ''}`;
    } else if (r.orderId) {
      $('buyquote').textContent = `外盘买入已提交（${r.status}）· 订单 ${r.orderId} · 耗时 ${used}s`;
    } else {
      const qs = r.quoteSymbol && r.quoteSymbol !== 'WBNB' ? r.quoteSymbol : 'BNB';
      $('buyquote').textContent = `买入已提交（${r.status}）· 花费 ${r.spentBnb} ${qs} ≈ ${(r.tokensOut || 0).toLocaleString(undefined,{maximumFractionDigits:2})} 枚 · 耗时 ${used}s${r.txHash ? ' · ' + r.txHash : ''}`;
    }
    refresh();
  } catch (e) { clearInterval(timer); $('err').textContent = `买入失败（耗时 ${secs()}s）: ${e.message}`; }
}

async function sell(token, pct) {
  if (!confirm(`确认卖出 ${pct}% 的该持仓？`)) return;
  $('err').textContent = '卖出中…';
  const body = curChain === 'rh'
    ? { token, pct, chain: 'rh' }
    : curChain === 'sol'
      ? { token, pct, slippage: +($('slip')?.value || 3), chain: 'sol' }
      : { token, pct, slippage: +($('slip')?.value || 3), chain: 'bsc' };
  try {
    const r = await j('/api/sell', { method:'POST', headers:{'content-type':'application/json'}, body:JSON.stringify(body) });
    if (!r.ok) { $('err').textContent = r.error; return; }
    $('err').textContent = '';
    if (curChain === 'sol') {
      $('buyquote').textContent = `卖出已提交 · 卖出约 ${(r.sold || 0).toLocaleString(undefined,{maximumFractionDigits:2})} 枚${r.orderId ? ' · 订单 ' + r.orderId : ''}`;
    } else if (curChain === 'rh') {
      $('buyquote').textContent = `卖出已提交（${r.status}）· 卖出约 ${(r.sold || 0).toLocaleString(undefined,{maximumFractionDigits:2})} 枚${r.txHash ? ' · ' + r.txHash : ''}`;
    } else if (r.orderId) {
      $('buyquote').textContent = `外盘卖出已提交（${r.status}）· 订单 ${r.orderId}`;
    } else {
      $('buyquote').textContent = `卖出已提交（${r.status}）· 卖出 ${(r.soldTokens || 0).toLocaleString(undefined,{maximumFractionDigits:2})} 枚 ≈ ${(r.quoteOut || 0).toFixed(4)} WBNB${r.txHash ? ' · ' + r.txHash : ''}`;
    }
    refresh();
  } catch (e) { $('err').textContent = '卖出失败: ' + e.message; }
}

async function toggleAuto(token, enabled) {
  try {
    const r = await j('/api/strategy', { method:'POST', headers:{'content-type':'application/json'}, body:JSON.stringify({ token, enabled }) });
    if (!r.ok) { $('err').textContent = r.error; return; }
    $('err').textContent = '';
    $('buyquote').textContent = enabled ? '已开启自动策略：涨 100% 卖 50%，跌 50% 清仓' : '已关闭该持仓的自动策略';
    refresh();
  } catch (e) { $('err').textContent = '设置失败: ' + e.message; }
}

async function transfer(token) {
  const to = '0xF55FC5FC56a09716F4Bf77Adb890630cFB6b0de7';
  if (!token) { $('err').textContent = '没有代币地址'; return; }
  if (!confirm(`确认把该代币【全部余额】转出到 ${to}？`)) return;
  $('err').textContent = '转出中…';
  try {
    const r = await j('/api/transfer', { method:'POST', headers:{'content-type':'application/json'}, body:JSON.stringify({ token }) });
    if (!r.ok) { $('err').textContent = r.error; return; }
    $('err').textContent = '';
    $('buyquote').textContent = `转出已提交（${r.status}）· ${r.amount.toLocaleString(undefined,{maximumFractionDigits:2})} 枚 → ${r.to}${r.txHash ? ' · ' + r.txHash : ''}`;
    refresh();
  } catch (e) { $('err').textContent = '转出失败: ' + e.message; }
}

async function unwrap() {
  if (!confirm('把全部 WBNB 解包成原生 BNB？')) return;
  $('err').textContent = '解包中…';
  try {
    const r = await j('/api/unwrap', { method:'POST', headers:{'content-type':'application/json'}, body:JSON.stringify({}) });
    if (!r.ok) { $('err').textContent = r.error; return; }
    $('err').textContent = '';
    $('buyquote').textContent = `解包已提交（${r.status}）· ${r.amount} WBNB → BNB${r.txHash ? ' · ' + r.txHash : ''}`;
    refresh();
  } catch (e) { $('err').textContent = '解包失败: ' + e.message; }
}
async function usdt2bnb() {
  if (!confirm('把全部 USDT 兑换成 BNB？')) return;
  $('err').textContent = '兑换中…';
  try {
    const r = await j('/api/usdt2bnb', { method:'POST', headers:{'content-type':'application/json'}, body:JSON.stringify({}) });
    if (!r.ok) { $('err').textContent = r.error; return; }
    $('err').textContent = '';
    $('buyquote').textContent = `USDT→BNB 已提交（${r.status}）· 订单 ${r.orderId || '—'}`;
    refresh();
  } catch (e) { $('err').textContent = '兑换失败: ' + e.message; }
}

$('qbtn').onclick = query;
$('pastebtn').onclick = async () => {
  $('err').textContent = '';
  try {
    const r = await j('/api/clipboard');
    if (!r.ok) { $('err').textContent = r.error; return; }
    if (!r.address) { $('err').textContent = '剪贴板里没找到 0x 开头的代币地址'; return; }
    $('token').value = r.address;
    await query();
  } catch (e) { $('err').textContent = '读取剪贴板失败: ' + e.message; }
};
$('buybtn').onclick = buy;
$('xferbtn').onclick = () => transfer($('token').value.trim());
$('refreshbtn').onclick = async () => {
  const b = $('refreshbtn');
  b.textContent = '刷新中…';
  await refresh();
  b.textContent = '已刷新';
  setTimeout(() => { b.textContent = '手动刷新'; }, 800);
};
$('discoverRefresh').onclick = () => loadDiscover();
document.querySelectorAll('.period').forEach((x) => { x.onclick = () => loadDiscover(x.dataset.p); });
$('accountsRefresh').onclick = () => loadAccounts();
setChain('rh');
let timer = setInterval(refresh, 1000);
$('interval').onchange = () => { clearInterval(timer); timer = setInterval(refresh, Number($('interval').value) || 1000); };
</script>
